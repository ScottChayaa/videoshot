<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>videoshot 介面配色</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* 版面：上方切換「一般畫面／剪輯」，左邊調色（預設、分組顏色、對比、存檔），右邊幾支手機即時預覽 */
:root {
  --pg-bg: #F3F3F6; --pg-panel: #FFFFFF; --pg-fg: #1C1D23; --pg-muted: #5E616E; --pg-line: #E2E3E9; --pg-accent: #2F4A86; --pg-chip: #ECEDF2; --pg-bad-bg: #F7DCD8; --pg-bad-fg: #8A2A22; --pg-good-fg: #1F6B4A;
  --sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --pg-bg: #111216; --pg-panel: #1A1B21; --pg-fg: #ECECF1; --pg-muted: #A1A4B2; --pg-line: #2C2E38; --pg-accent: #9FB2E8; --pg-chip: #24262F; --pg-bad-bg: #4A2422; --pg-bad-fg: #FFC9C2; --pg-good-fg: #8FDDB6; color-scheme: dark } }
:root[data-theme="dark"] { --pg-bg: #111216; --pg-panel: #1A1B21; --pg-fg: #ECECF1; --pg-muted: #A1A4B2; --pg-line: #2C2E38; --pg-accent: #9FB2E8; --pg-chip: #24262F; --pg-bad-bg: #4A2422; --pg-bad-fg: #FFC9C2; --pg-good-fg: #8FDDB6; color-scheme: dark }
* { box-sizing: border-box }
[hidden] { display: none !important }
body { margin: 0; background: var(--pg-bg); color: var(--pg-fg); font-family: var(--sans); font-size: 14px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 48px }
.wrap { max-width: 1480px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px }
header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between }
header h1 { font-size: 22px; font-weight: 700; margin: 0; text-wrap: balance }
header p { margin: 2px 0 0; color: var(--pg-muted) }
.modes { display: inline-flex; padding: 3px; border-radius: 11px; background: var(--pg-chip); gap: 2px }
.modes button { font: inherit; font-size: 14px; font-weight: 500; border: 0; border-radius: 9px; padding: 7px 16px; background: transparent; color: var(--pg-fg); cursor: pointer }
.modes button:hover { background: var(--pg-line) }
.modes button[aria-selected="true"] { background: var(--pg-accent); color: var(--pg-panel); font-weight: 700 }
.grid { display: grid; grid-template-columns: minmax(0, 400px) minmax(0, 1fr); gap: 20px; align-items: start }
@media (max-width: 900px) { .grid { grid-template-columns: minmax(0, 1fr) } }
.panel { background: var(--pg-panel); border: 1px solid var(--pg-line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0 }
@media (min-width: 901px) { .ctrl { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); max-height: calc(100vh - 24px); overflow-y: auto } }
.panel h2 { font-size: 13px; font-weight: 500; color: var(--pg-muted); letter-spacing: .06em; margin: 0 }
.panel h3 { font-size: 13px; font-weight: 700; margin: 6px 0 0; color: var(--pg-fg) }
.presets { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px }
.preset { display: flex; flex-direction: column; gap: 6px; padding: 6px; border: 1px solid var(--pg-line); border-radius: 10px; background: none; color: var(--pg-fg); font: inherit; font-size: 12px; cursor: pointer; line-height: 1.3; text-align: left; position: relative; min-width: 0 }
.preset:hover { border-color: var(--pg-muted) }
.preset[aria-pressed="true"] { border-color: var(--pg-accent); box-shadow: 0 0 0 1px var(--pg-accent) }
.mini { height: 40px; border-radius: 6px; padding: 5px; display: flex; flex-direction: column; gap: 3px; overflow: hidden }
.mini .card { flex: 1; border-radius: 4px; border: 1px solid; display: flex; align-items: center; gap: 4px; padding: 0 4px }
.mini .bar { height: 3px; border-radius: 2px; flex: 1 }
.mini .btn { width: 16px; height: 9px; border-radius: 3px }
.preset .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 14px }
.preset .del { position: absolute; bottom: 4px; right: 4px; font-size: 13px; line-height: 1; color: var(--pg-muted); padding: 2px 4px; border-radius: 6px }
.preset .del:hover { color: var(--pg-fg); background: var(--pg-line) }
.colors { display: flex; flex-direction: column; gap: 8px }
.crow { display: grid; grid-template-columns: 30px minmax(0, 1fr) 88px auto; align-items: center; gap: 4px 10px }
.crow .swatch { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--pg-line); display: block }
.crow .lab { display: flex; flex-direction: column; line-height: 1.3; min-width: 0 }
.crow .lab label { font-weight: 500 }
.crow .lab span { font-size: 11.5px; color: var(--pg-muted) }
.crow input[type=text] { font-family: var(--mono); font-size: 12.5px; width: 100%; height: 30px; padding: 0 7px; border: 1px solid var(--pg-line); border-radius: 8px; background: var(--pg-bg); color: var(--pg-fg) }
.crow input[aria-invalid="true"] { border-color: #D2493F }
.crow .pick { font: inherit; font-size: 12px; height: 30px; width: 34px; padding: 0; border-radius: 8px; border: 1px solid var(--pg-line); background: var(--pg-bg); color: var(--pg-fg); cursor: pointer; display: grid; place-items: center }
.crow .pick:hover, .crow .pick[aria-expanded="true"] { border-color: var(--pg-accent) }
.crow .pick svg { width: 16px; height: 16px }
.picker { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 10px; padding: 12px; border: 1px solid var(--pg-line); border-radius: 10px; background: var(--pg-bg); margin-top: 4px }
.picker[hidden] { display: none }
.sv { position: relative; height: 140px; border-radius: 8px; cursor: crosshair; touch-action: none;
  background-image: linear-gradient(to top, #000, transparent), linear-gradient(to right, #fff, transparent) }
.sv .dot { position: absolute; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.45); pointer-events: none }
.hue { -webkit-appearance: none; appearance: none; width: 100%; height: 14px; border-radius: 7px; margin: 0; cursor: pointer;
  background: linear-gradient(to right, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00) }
.hue::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 1px solid rgba(0,0,0,.4) }
.hue::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 1px solid rgba(0,0,0,.4) }
.picker .pl { font-size: 12px; color: var(--pg-muted) }
.sw { display: flex; flex-wrap: wrap; gap: 6px }
.sw button { width: 22px; height: 22px; border-radius: 6px; border: 1px solid var(--pg-line); cursor: pointer; padding: 0 }
.picker .done { align-self: flex-end }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center }
.actions input { font: inherit; font-size: 13px; height: 34px; padding: 0 10px; border: 1px solid var(--pg-line); border-radius: 9px; background: var(--pg-bg); color: var(--pg-fg); flex: 1 1 140px; min-width: 0 }
button.b { font: inherit; font-size: 13px; padding: 6px 12px; height: 34px; border-radius: 9px; border: 1px solid var(--pg-line); background: var(--pg-bg); color: var(--pg-fg); cursor: pointer; white-space: nowrap }
button.b:hover { border-color: var(--pg-accent) }
button.b.primary { background: var(--pg-accent); border-color: var(--pg-accent); color: var(--pg-panel) }
button:focus-visible, input:focus-visible { outline: 2px solid var(--pg-accent); outline-offset: 2px }
.msg { font-size: 12px; color: var(--pg-muted) }
pre.out { font-family: var(--mono); font-size: 11.5px; line-height: 1.5; background: var(--pg-bg); border: 1px solid var(--pg-line); border-radius: 8px; padding: 8px 10px; margin: 0; white-space: pre; overflow-x: auto; max-height: 220px; user-select: all }
details summary { cursor: pointer; font-size: 13px; color: var(--pg-muted) }
.contrast { display: flex; gap: 6px; flex-wrap: wrap }
.contrast .sum { width: 100%; font-size: 12.5px; font-weight: 500 }
.contrast .sum.ok { color: var(--pg-good-fg) }
.contrast .sum.bad { color: var(--pg-bad-fg) }
.cbadge { font-size: 11.5px; padding: 2px 8px; border-radius: 999px; background: var(--pg-chip); font-variant-numeric: tabular-nums }
.cbadge.low { background: var(--pg-bad-bg); color: var(--pg-bad-fg) }
.note { font-size: 12px; color: var(--pg-muted); margin: 0 }

.stage { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; min-width: 0 }
.shot { display: flex; flex-direction: column; gap: 8px; align-items: center; min-width: 0; max-width: 100% }
.shot > .cap { font-size: 12.5px; color: var(--pg-muted) }

/* ── 手機預覽：只用 --c-*（使用者調的顏色），不跟這頁的淺色／深色走 ── */
.ph { width: 360px; max-width: 100%; height: 760px; border-radius: 34px; border: 7px solid #15161A; overflow: hidden; background: var(--c-bg); color: var(--c-text);
  display: flex; flex-direction: column; font-family: var(--sans); font-size: 15px; line-height: 1.45; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,.18) }
.sbar { height: 26px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; font-size: 12px; font-weight: 700; background: var(--c-bg); color: var(--c-text); font-variant-numeric: tabular-nums }
.sbar i { display: inline-flex; gap: 4px; font-style: normal }
.sbar i b { display: inline-block; width: 14px; height: 9px; border-radius: 2px; background: currentColor; opacity: .85 }
.scr { flex: 1; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; min-height: 0; scrollbar-width: thin }
.ico { width: 22px; height: 22px; flex: none; display: block }
.tb { flex: none; display: flex; align-items: center; height: 61px; padding: 0 6px 0 16px; background: var(--c-bg); border-bottom: 1px solid var(--c-border); gap: 2px }
.tb.nodiv { border-bottom-color: transparent }
.tb.back { padding-left: 4px }
.tb .t { flex: 1; font-size: 24px; font-weight: 700; color: var(--c-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.tb .t.s { font-size: 17px }
.ib { width: 44px; height: 44px; border-radius: 8px; display: grid; place-items: center; color: var(--c-textDim); position: relative; flex: none }
.ib.tx { color: var(--c-text) }
.ib.on { color: var(--c-accent) }
.ib .bd { position: absolute; top: 5px; right: 3px; min-width: 16px; height: 16px; padding: 0 3px; border-radius: 8px; background: var(--c-danger); color: var(--c-dangerInk); font-size: 11px; font-weight: 700; line-height: 16px; text-align: center; box-shadow: 0 0 0 1.5px var(--c-bg) }
.ib .bd.dot { min-width: 0; width: 9px; height: 9px; padding: 0; top: 9px; right: 9px }
.ib.off { color: var(--c-textFaint); opacity: .7 }
.nav { flex: none; background: var(--c-surface); border-top: 1px solid var(--c-border); display: grid; grid-template-columns: repeat(5, 1fr); height: 60px; padding-bottom: 2px }
.nav > div { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--c-textDim); font-size: 12px; font-weight: 500; position: relative }
.nav > div.sel { color: var(--c-accent); font-weight: 700 }
.nav .icw { height: 26px; display: grid; place-items: center; position: relative }
.nav .cap { width: 30px; height: 26px; border-radius: 8px; background: var(--c-accent); color: var(--c-accentInk); display: grid; place-items: center }
.nav .cap .ico { width: 20px; height: 20px }
.nav .ava { width: 24px; height: 24px; border-radius: 50%; background: var(--c-accent); color: var(--c-accentInk); font-size: 12px; font-weight: 700; display: grid; place-items: center }
.nav .ico { width: 24px; height: 24px }
.nav .nb { position: absolute; top: -4px; left: calc(50% + 4px); min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--c-danger); color: var(--c-dangerInk); font-size: 11px; font-weight: 700; line-height: 16px; text-align: center }
.pad { padding: 16px; display: flex; flex-direction: column; gap: 16px }
.grp { display: flex; flex-direction: column; gap: 8px }
.st { font-size: 15px; font-weight: 700; color: var(--c-textDim) }
.st.full { padding: 8px 16px 0 }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.frame { border-radius: 10px; overflow: hidden; outline: 1px dashed var(--c-border); outline-offset: 2px }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 8px; font-size: 13px; line-height: 18px; background: color-mix(in srgb, var(--c-text) 4%, transparent); color: var(--c-text); white-space: nowrap }
.chip .ico { width: 15px; height: 15px }
.chip.pl .ico { color: var(--c-place) }
.chip.tg .ico { color: var(--c-tag) }
.chip .n { color: var(--c-textDim) }
.chip.on { background: var(--c-accent); color: var(--c-accentInk) }
.chip.on .ico, .chip.on .n { color: var(--c-accentInk) }
.chip.mn { padding: 2px 6px; font-size: 12px; line-height: 16px; gap: 3px }
.chip.mn .ico { width: 13px; height: 13px }
.chip.ring { box-shadow: 0 0 0 2px var(--c-focus) }
.skel { display: flex; flex-wrap: wrap; gap: 8px }
.skel span, .sk { height: 26px; border-radius: 8px; background: var(--c-border); position: relative; overflow: hidden }
.sk { height: auto }
@media (prefers-reduced-motion: no-preference) {
  .skel span::after, .sk::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--c-surface) 75%, transparent), transparent); transform: translateX(-100%); animation: sh 1.6s infinite }
  @keyframes sh { to { transform: translateX(100%) } }
}
.skgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px }
.skgrid .sk { aspect-ratio: 1; border-radius: 0 }
.shd { display: flex; align-items: center; height: 52px; border-bottom: 1px solid var(--c-border); gap: 8px; background: var(--c-surface); padding: 0 8px 0 16px; border-radius: 10px 10px 0 0 }
.shd .t { flex: 1; font-size: 17px; font-weight: 700; color: var(--c-text) }
.ta { font-size: 15px; font-weight: 500; color: var(--c-accent); padding: 0 8px }
.ta.off { color: var(--c-textFaint) }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid transparent; font-size: 15px; font-weight: 500; white-space: nowrap }
.btn .ico { width: 18px; height: 18px }
.btn.pri { background: var(--c-accent); color: var(--c-accentInk) }
.btn.sec { background: var(--c-surface); color: var(--c-text); border-color: var(--c-borderStrong) }
.btn.qt { background: transparent; color: var(--c-textDim) }
.btn.dg { background: var(--c-danger); color: var(--c-dangerInk) }
.btn.dq { background: var(--c-surface); color: var(--c-danger); border-color: var(--c-borderStrong) }
.btn.off { background: var(--c-surface2); color: var(--c-textFaint); border-color: var(--c-border) }
.btn.sm { height: 36px; padding: 0 12px; font-size: 15px }
.btn.blk { width: 100% }
.icb { width: 44px; height: 44px; border-radius: 8px; border: 1px solid var(--c-borderStrong); background: var(--c-surface); color: var(--c-text); display: grid; place-items: center }
.icb.off { background: var(--c-surface2); color: var(--c-textFaint); border-color: var(--c-border) }
.fbs { display: flex }
.fb { width: 48px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding-top: 4px; font-size: 12px; color: var(--c-textDim) }
.fb .w { position: relative; color: var(--c-accent) }
.fb .ok { position: absolute; top: -4px; right: -7px; width: 16px; height: 16px; border-radius: 50%; background: var(--c-done); box-shadow: 0 0 0 1.5px var(--c-surface); display: grid; place-items: center; color: #fff }
.fb .ok .ico { width: 11px; height: 11px }
.fb.off, .fb.off .w { color: var(--c-textFaint) }
.lr { display: flex; align-items: center; gap: 16px; min-height: 56px; padding: 10px 16px; color: var(--c-text) }
.lr > .ico:first-child { color: var(--c-textDim) }
.lr .tx { flex: 1; min-width: 0; display: flex; flex-direction: column }
.lr .tt { font-size: 17px; color: var(--c-text) }
.lr .ss { font-size: 15px; color: var(--c-textDim); margin-top: 2px }
.lr .chev { color: var(--c-textFaint); width: 18px; height: 18px }
.lr.dgr .tt, .lr.dgr > .ico:first-child { color: var(--c-danger) }
.lr .val { font-size: 15px; color: var(--c-textDim) }
.inset { margin: 0 -16px }
.empty { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px 8px; text-align: center }
.empty > .ico { width: 34px; height: 34px; color: var(--c-textFaint) }
.empty .m { font-size: 17px; color: var(--c-textDim) }
.empty .m2 { font-size: 15px; color: var(--c-textDim); margin-top: -4px }
.tf { display: flex; flex-direction: column; gap: 6px }
.tf .lb { font-size: 15px; font-weight: 500; color: var(--c-textDim); display: flex; align-items: center; gap: 6px }
.tf .lb.ac { color: var(--c-accent) }
.tf .lb.ac::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c-accent) }
.tf .bx { height: 48px; border-radius: 8px; border: 1px solid var(--c-borderStrong); background: var(--c-surface); display: flex; align-items: center; gap: 8px; padding: 0 12px; font-size: 17px; color: var(--c-text) }
.tf .bx .ph2 { color: var(--c-textFaint) }
.tf .bx .ph2.mx { color: var(--c-textDim) }
.tf .bx > .ico { color: var(--c-textDim); width: 20px; height: 20px }
.tf .bx.fo { border-color: var(--c-accent); box-shadow: 0 0 0 3px var(--c-accentWeak) }
.tf .bx.fo .cur { width: 2px; height: 22px; background: var(--c-accent); margin-left: -6px }
.tf .bx.dn { height: 40px; background: var(--c-surface2); border-color: var(--c-border); font-size: 15px }
.tf .bx.er { border-color: var(--c-warn) }
.tf .sup { font-size: 13px; color: var(--c-textDim) }
.tf .sup.er { color: var(--c-warn) }
.tabs { display: flex; background: var(--c-bg); border-bottom: 1px solid var(--c-border) }
.tabs div { flex: 1; text-align: center; padding: 12px 0 11px; font-size: 17px; color: var(--c-textDim); position: relative }
.tabs div.on { color: var(--c-text); font-weight: 700 }
.tabs div.on::after { content: ""; position: absolute; left: 22%; right: 22%; bottom: -1px; height: 3px; border-radius: 2px; background: var(--c-accent) }
.pill { display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 0 12px; border-radius: 8px; font-size: 13px; background: color-mix(in srgb, var(--c-text) 4%, transparent); color: var(--c-text); border: 1px solid transparent }
.pill .ico { width: 15px; height: 15px }
.pill.on { background: var(--c-accent); color: var(--c-accentInk) }
.pill.qt { background: transparent }
.pill.off { opacity: .5 }
.sel { display: flex; flex-direction: column; gap: 6px }
.sel .lb { font-size: 15px; font-weight: 500; color: var(--c-textDim) }
.sel .bx { height: 48px; border-radius: 8px; border: 1px solid var(--c-borderStrong); background: var(--c-surface); display: flex; align-items: center; padding: 0 12px; font-size: 17px; color: var(--c-text) }
.sel .bx span { flex: 1 }
.sel .bx .ico { color: var(--c-textDim); width: 18px; height: 18px }
.sgt { font-size: 15px; color: var(--c-textDim); padding: 16px 16px 8px }
.sg { background: var(--c-surface); border-top: 1px solid var(--c-border); border-bottom: 1px solid var(--c-border) }
.sg .dv { height: 1px; background: var(--c-border); margin-left: 16px }
.sgn { font-size: 15px; color: var(--c-textDim); padding: 8px 16px 0 }
.rd { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--c-borderStrong); display: grid; place-items: center; flex: none }
.rd.on { border-color: var(--c-accent) }
.rd.on::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--c-accent) }
.stp { display: flex; align-items: center; gap: 4px }
.stp b { min-width: 48px; text-align: center; font-size: 17px; color: var(--c-text); font-variant-numeric: tabular-nums }
.stp span { width: 36px; height: 36px; border-radius: 8px; background: var(--c-surface2); border: 1px solid var(--c-border); color: var(--c-accent); display: grid; place-items: center; font-size: 20px; font-weight: 500 }
.stp span.off { opacity: .4 }
.dock { flex: none; background: var(--c-surface); border-top: 1px solid var(--c-border); display: flex; align-items: center; gap: 12px; padding: 8px 16px }
.dock .s { flex: 1; font-size: 15px; color: var(--c-textDim) }
.dock .btn { flex: 1 }
.dock .s + .btn { flex: none }
.banner { display: flex; gap: 10px; padding: 12px; border-radius: 12px; background: var(--c-warnWeak); color: var(--c-warn); font-size: 15px; align-items: flex-start }
.banner .ico { width: 20px; height: 20px; margin-top: 1px }
.mh { display: flex; align-items: baseline; gap: 8px; padding: 12px 16px 6px }
.mh b { font-size: 17px; color: var(--c-text) }

/* ── 色彩工具 ── */
const hexToRgb = h => { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
const rgbToHex = a => '#' + a.map(x => Math.round(Math.max(0, Math.min(255, x))).toString(16).padStart(2, '0')).join('').toUpperCase();
const lum = h => hexToRgb(h).map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }).reduce((s, v, j) => s + v * [.2126, .7152, .0722][j], 0);
const ratio = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); };
const mix = (a, b, t) => { const x = hexToRgb(a), y = hexToRgb(b); return rgbToHex(x.map((v, i) => v + (y[i] - v) * t)); };
function hsvToHex(h, s, v) {
  const f = n => { const k = (n + h / 60) % 6; return v - v * s * Math.max(0, Math.min(k, 4 - k, 1)); };
  return rgbToHex([f(5), f(3), f(1)].map(x => x * 255));
}
function hexToHsv(hex) {
  const [r, g, b] = hexToRgb(hex).map(x => x / 255);
  const mx = Math.max(r, g, b), d = mx - Math.min(r, g, b);
  let h = 0;
  if (d) h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return { h: (h * 60 + 360) % 360, s: mx ? d / mx : 0, v: mx };
}

/* ── 對比檢查（與 PaletteTest 同一組；剪輯多兩項時間軸） ── */
function checks(c, mode) {
  const list = [
    ['主文字對底色', c.text, c.bg, 4.5], ['主文字對卡片', c.text, c.surface, 4.5], ['次要文字對底色', c.textDim, c.bg, 4.5],
    ['極次要文字對卡片', c.textFaint, c.surface, 4.5], ['主色上的字', c.accentInk, c.accent, 4.5], ['破壞色上的字', c.dangerInk, c.danger, 4.5],
    ['破壞色對卡片', c.danger, c.surface, 4.5], ['警示色對卡片', c.warn, c.surface, 4.5], ['完成色對卡片', c.ok, c.surface, 4.5],
    ['主色當文字對底色', c.accent, c.bg, 4.5], ['主色當文字對卡片', c.accent, c.surface, 4.5],
  ];
  if (mode === 'clip') list.push(['刻度數字對時間軸', c.textDim, c.timeline, 4.5], ['播放頭對時間軸', c.playhead, c.timeline, 3], ['序號白字對已選色', '#FFFFFF', c.selectedMark, 3]);
  else list.push(['頭像白字對漸層', '#FFFFFF', c.hero1, 3], ['看大圖白字', '#FFFFFF', c.lightbox, 4.5], ['進度條對黑底', c.progress, '#000000', 3], ['已選白勾對已選色', '#FFFFFF', c.selected, 3], ['完成白勾對完成勾勾', '#FFFFFF', c.done, 3]);
  return list.map(([n, a, b, min]) => ({ n, r: ratio(a, b), min }));
}
function accentLikeDanger(c) {
  const a = hexToRgb(c.accent), d = hexToRgb(c.danger);
  return a.every((v, i) => Math.abs(v - d[i]) / 255 < .12);
}

/* ── 狀態 ── */
const $ = id => document.getElementById(id);
const CUR_KEY = 'videoshot-ui-current';
let saved = {};
try { saved = JSON.parse(localStorage.getItem(CUR_KEY) || '{}') || {}; } catch (e) { saved = {}; }
const mine = {};
for (const m in MODES) {
  try { mine[m] = JSON.parse(localStorage.getItem(MODES[m].store) || '[]') || []; } catch (e) { mine[m] = []; }
}
const fieldsOf = m => MODES[m].groups.flatMap(g => g[1].map(f => f[0]));
const state = {};
for (const m in MODES) {
  const base = { ...MODES[m].presets[0] };
  const s = saved[m];
  if (s) fieldsOf(m).forEach(k => { if (/^#[0-9A-F]{6}$/i.test(s[k] || '')) base[k] = s[k].toUpperCase(); });
  state[m] = base;
}
let mode = location.hash === '#clip' ? 'clip' : location.hash === '#app' ? 'app' : (saved.mode === 'clip' ? 'clip' : 'app');
let pk = null;
const cur = () => state[mode];
function persist() { try { localStorage.setItem(CUR_KEY, JSON.stringify({ mode, app: state.app, clip: state.clip })); } catch (e) {} }

/* ── 左側：欄位 ── */
function buildColors() {
  const M = MODES[mode];
  const all = M.presets.concat(mine[mode]);
  $('colors').innerHTML = M.groups.map(([gname, fields]) => `<h3>${gname}</h3>` + fields.map(([k, name, hint]) => {
    const used = [...new Set(all.map(p => (p[k] || '').toUpperCase()).filter(Boolean))];
    return `<div class="crow">
      <span class="swatch" id="c-${k}"></span>
      <span class="lab"><label for="h-${k}">${name}</label><span>${hint}</span></span>
      <input type="text" id="h-${k}" spellcheck="false" autocomplete="off" maxlength="7">
      <button type="button" class="pick" id="pb-${k}" aria-expanded="false" aria-controls="pk-${k}" aria-label="${name}的調色盤">${I('palette')}</button>
      <div class="picker" id="pk-${k}" hidden>
        <div class="sv" id="sv-${k}" aria-label="${name}的深淺與鮮豔度"><span class="dot" id="dot-${k}"></span></div>
        <input type="range" class="hue" id="hue-${k}" min="0" max="359" step="1" aria-label="${name}的色相">
        <span class="pl">其他配色用過的${name}</span>
        <div class="sw">${used.map(c => `<button type="button" style="background:${c}" data-c="${c}" aria-label="${c}"></button>`).join('')}</div>
        <button type="button" class="b done" data-done>完成</button>
      </div>
    </div>`;
  }).join('')).join('');

  fieldsOf(mode).forEach(k => {
    $('pb-' + k).addEventListener('click', () => openPicker(k));
    const pkEl = $('pk-' + k), sv = $('sv-' + k);
    pkEl.querySelector('[data-done]').addEventListener('click', () => openPicker(k));
    pkEl.querySelector('.sw').addEventListener('click', e => {
      const c = e.target.dataset.c; if (!c) return;
      cur()[k] = c; Object.assign(pk, hexToHsv(c)); update(false, true);
    });
    $('hue-' + k).addEventListener('input', e => { pk.h = +e.target.value; fromPicker(); });
    const move = e => {
      const r = sv.getBoundingClientRect();
      pk.s = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
      pk.v = 1 - Math.min(1, Math.max(0, (e.clientY - r.top) / r.height));
      fromPicker();
    };
    sv.addEventListener('pointerdown', e => { sv.setPointerCapture(e.pointerId); move(e); });
    sv.addEventListener('pointermove', e => { if (sv.hasPointerCapture(e.pointerId)) move(e); });
    $('h-' + k).addEventListener('input', e => {
      let v = e.target.value.trim(); if (v[0] !== '#') v = '#' + v;
      const ok = /^#[0-9a-fA-F]{6}$/.test(v);
      e.target.setAttribute('aria-invalid', ok ? 'false' : 'true');
      if (ok) { cur()[k] = v.toUpperCase(); update(true); }
    });
  });
}
function syncPicker() {
  if (!pk) return;
  const k = pk.k;
  $('sv-' + k).style.backgroundColor = hsvToHex(pk.h, 1, 1);
  $('dot-' + k).style.left = (pk.s * 100) + '%';
  $('dot-' + k).style.top = ((1 - pk.v) * 100) + '%';
  $('dot-' + k).style.background = cur()[k];
  $('hue-' + k).value = Math.round(pk.h);
}
function openPicker(k) {
  const was = pk && pk.k;
  if (pk) { $('pk-' + pk.k).hidden = true; $('pb-' + pk.k).setAttribute('aria-expanded', 'false'); pk = null; }
  if (was === k) return;
  pk = { k, ...hexToHsv(cur()[k]) };
  $('pk-' + k).hidden = false; $('pb-' + k).setAttribute('aria-expanded', 'true');
  syncPicker();
}
function fromPicker() { cur()[pk.k] = hsvToHex(pk.h, pk.s, pk.v); update(false, true); }

/* ── 左側：預設 ── */
const same = (a, b) => fieldsOf(mode).every(k => (a[k] || '').toUpperCase() === (b[k] || '').toUpperCase());
function miniOf(p) {
  return `<span class="mini" style="background:${p.bg}"><span class="card" style="background:${p.surface};border-color:${p.border}"><span class="bar" style="background:${p.text}"></span><span class="btn" style="background:${p.accent}"></span></span>` +
    `<span class="card" style="background:${p.surface};border-color:${p.border}"><span class="bar" style="background:${p.textDim};flex:.6"></span><span class="btn" style="background:${p.danger};width:9px"></span></span></span>`;
}
function renderPresets() {
  const all = MODES[mode].presets.map((p, idx) => ({ p, idx, own: false })).concat(mine[mode].map((p, idx) => ({ p, idx, own: true })));
  $('presets').innerHTML = all.map(({ p, idx, own }) => `
    <button type="button" class="preset" data-own="${own}" data-idx="${idx}" aria-pressed="${same(p, cur())}">
      ${miniOf(p)}<span class="nm">${p.n}</span>${own ? `<span class="del" role="button" aria-label="刪除 ${p.n}" data-del="${idx}">×</span>` : ''}
    </button>`).join('');
}
$('presets').addEventListener('click', e => {
  const del = e.target.closest('[data-del]');
  if (del) {
    mine[mode].splice(+del.dataset.del, 1);
    try { localStorage.setItem(MODES[mode].store, JSON.stringify(mine[mode])); } catch (err) {}
    renderPresets(); return;
  }
  const b = e.target.closest('.preset'); if (!b) return;
  const src = b.dataset.own === 'true' ? mine[mode][+b.dataset.idx] : MODES[mode].presets[+b.dataset.idx];
  fieldsOf(mode).forEach(k => { if (src[k]) cur()[k] = src[k].toUpperCase(); });
  update();
});
$('save').addEventListener('click', () => {
  const n = $('saveName').value.trim() || ('自訂 ' + (mine[mode].length + 1));
  const rec = { n }; fieldsOf(mode).forEach(k => rec[k] = cur()[k]);
  mine[mode].push(rec);
  try { localStorage.setItem(MODES[mode].store, JSON.stringify(mine[mode])); } catch (err) {}
  $('saveName').value = '';
  $('msg').textContent = '已存成「' + n + '」';
  buildColors(); update();
});

const kc = h => 'Color(0xFF' + h.slice(1).toUpperCase() + ')';
const ka = (h, a) => 'Color(0x' + a + h.slice(1).toUpperCase() + ')';
function outText() {
  const c = cur();
  if (mode === 'app') {
    return [
      '// 一般畫面（Palette）',
      `bg = ${kc(c.bg)},`, `surface = ${kc(c.surface)},`, `surface2 = ${kc(c.surface2)},`, `border = ${kc(c.border)},`, `borderStrong = ${kc(c.borderStrong)},`,
      `text = ${kc(c.text)},`, `textDim = ${kc(c.textDim)},`, `textFaint = ${kc(c.textFaint)},`,
      `accent = ${kc(c.accent)},`, `accentInk = ${kc(c.accentInk)},`, `accentWeak = ${kc(c.accentWeak)},`, `accentLine = ${kc(mix(c.accent, c.surface, .68))},`,
      `hero1 = ${kc(c.hero1)},`, `hero2 = ${kc(c.hero2)},`,
      `danger = ${kc(c.danger)},`, `dangerInk = ${kc(c.dangerInk)},`, `dangerWeak = ${kc(mix(c.danger, c.surface, .9))},`,
      `warn = ${kc(c.warn)},`, `warnWeak = ${kc(c.warnWeak)},`, `ok = ${kc(c.ok)},`, `okWeak = ${kc(mix(c.ok, c.surface, .88))},`,
      `overlay = ${ka(c.text, '6B')},`, `scrim = Color(0x9E000000),`, `lightboxBg = ${kc(c.lightbox)},`, `focusRing = ${ka(c.accent, '8C')},`, `selectedMark = ${kc(c.selected)},`, `doneMark = ${kc(c.done)},`, `playerProgress = ${kc(c.progress)},`,
      '', '// 種類色（KindColors）', `place = ${kc(c.place)}`, `tag = ${kc(c.tag)}`,
    ].join('\n');
  }
  return ['// 剪輯（暗色）', ...fieldsOf('clip').map(k => `${k} = ${kc(c[k])},`)].join('\n');
}
$('copy').addEventListener('click', () => {
  const t = outText();
  const fallback = () => { $('out').closest('details').open = true; const r = document.createRange(); r.selectNodeContents($('out')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); $('msg').textContent = '請按 Ctrl+C 複製'; };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(() => { $('msg').textContent = '已複製'; }, fallback);
  else fallback();
});

/* ── 套用 ── */
function applyVars() {
  const c = cur(), st = $('stage');
  fieldsOf(mode).forEach(k => st.style.setProperty('--c-' + k, c[k]));
  st.style.setProperty('--c-focus', c.accent + '8C');
}
function update(fromText, picked) {
  const c = cur();
  fieldsOf(mode).forEach(k => {
    $('c-' + k).style.background = c[k];
    if (!fromText) { $('h-' + k).value = c[k]; $('h-' + k).setAttribute('aria-invalid', 'false'); }
  });
  if (pk && !picked) Object.assign(pk, hexToHsv(c[pk.k]));
  syncPicker();
  applyVars();
  renderPresets();
  $('out').textContent = outText();
  const res = checks(c, mode);
  const low = res.filter(x => x.r < x.min);
  const red = accentLikeDanger(c);
  const bad = low.length + (red ? 1 : 0);
  $('contrast').innerHTML = `<span class="sum ${bad ? 'bad' : 'ok'}">${bad ? `${bad} 項沒過` : `${res.length + 1} 項全過`}</span>` +
    res.map(x => `<span class="cbadge${x.r < x.min ? ' low' : ''}">${x.n} ${x.r.toFixed(1)}${x.r < x.min ? `（要 ${x.min}）` : ''}</span>`).join('') +
    `<span class="cbadge${red ? ' low' : ''}">${red ? '主色太像破壞色' : '主色與破壞色分得開'}</span>`;
  persist();
}
function setMode(m) {
  mode = m;
  if (pk) pk = null;
  document.querySelectorAll('.modes button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.mode === m)));
  $('note').textContent = MODES[m].note;
  $('stage').innerHTML = m === 'app' ? appScreens() : clipScreens();
  buildColors();
  update();
}
document.querySelectorAll('.modes button').forEach(b => b.addEventListener('click', () => { if (b.dataset.mode !== mode) { $('msg').textContent = ''; setMode(b.dataset.mode); } }));
setMode(mode);
</script>
