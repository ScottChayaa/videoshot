<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>videoshot · 詳細</title>
<link rel="stylesheet" href="styles.css">
<script src="auth.js"></script>
</head>
<body>
<div class="app-main">
  <div class="topbar">
    <button class="back" id="backBtn" onclick="history.length>1?history.back():location.href='home.html'"></button>
    <span class="title" id="vtitle">影片</span>
    <button class="more" id="moreBtn"></button>
  </div>

  <!-- 自繪播放器（與取圖精靈第二步共用 APP.mountPlayer）-->
  <div id="player"></div>

  <!-- v1 完全不顯示目前這一張的圖資，整頁只有播放器 + 三張縮圖 + 大片空白 -->
  <div class="clip-meta" id="clipMeta" hidden></div>

  <div class="section">
    <h3>這支影片的收藏 <span class="count" id="clipCount"></span></h3>
    <div class="clip-grid" id="clipGrid"></div>
  </div>
</div>

<div id="nav"></div>

<script src="/shared/storyboard.js"></script>
<script src="mock-data.js"></script>
<script src="app.js"></script>
<script>
  document.getElementById('nav').innerHTML = APP.renderNav('home');
  document.getElementById('backBtn').innerHTML = APP.svg(APP.ICONS.back, 'ic');
  document.getElementById('moreBtn').innerHTML = APP.svg(APP.ICONS.more, 'ic', true);

  const params = new URLSearchParams(location.search);
  const videoId = params.get('v') || 'Ea8ICLXTDaU';
  const focusClip = params.get('c');
  const t = params.get('t');
  const video = M.VIDEOS[videoId];
  let clips = M.CLIPS.filter(c => c.videoId === videoId).sort((a, b) => a.start - b.start);

  document.getElementById('vtitle').textContent = video.title;
  document.getElementById('clipCount').textContent = `(${clips.length})`;

  let selectedId = focusClip || (clips[0] && clips[0].id);
  const startAt = t ? +t                                    // Lightbox【影片播放】帶秒數進來
    : (clips.find(x => x.id === selectedId) || {}).start || 0;
  const player = APP.mountPlayer(document.getElementById('player'),
    { videoId, duration: video.duration, at: startAt });
  player.setRegions(clips, selectedId);

  function focus(c) { selectedId = c.id; player.setRegions(clips, selectedId); player.seek(c.start); renderClips(); }

  /* 目前這一張的圖資（描述才是使用者當初存下它的理由）*/
  function renderMeta() {
    const c = clips.find(x => x.id === selectedId);
    const box = document.getElementById('clipMeta');
    box.hidden = !c;
    if (!c) return;
    const chips = M.shotFacets(c).map(f => APP.tagChip(f)).join('');
    box.innerHTML = `
      <div class="desc ${c.summary ? '' : 'dim'}">${c.summary || '還沒有描述'}</div>
      ${chips ? `<div class="chips">${chips}</div>` : ''}
      <div class="meta-line">
        <span>${M.fmtDateLabel(c.eventDate)}</span>
        <span>影片 ${M.fmtTime(c.start)}</span>
      </div>
      <button class="btn secondary" id="metaEdit">${APP.svg(APP.ICONS.edit, 'ic')} 編輯這張的圖資</button>`;
    document.getElementById('metaEdit').onclick = () =>
      APP.openShotSheet(c, () => { renderClips(); });
  }
  // ⋯ 選單：影片層級管理
  document.getElementById('moreBtn').onclick = () => {
    const sh = APP.openPanel(`
      <div class="srow"><span class="trange">影片管理</span>
        <button class="close" onclick="closeSheet()">${APP.svg(APP.ICONS.close, 'ic')}</button></div>
      <button class="act-row" id="vmCap">${APP.svg(APP.ICONS.plus, 'ic')} 繼續取這支的圖</button>
      <button class="act-row" id="vmMeta">${APP.svg(APP.ICONS.edit, 'ic')} 批次編輯圖資</button>
      <button class="act-row danger" id="vmDel">${APP.svg(APP.ICONS.trash, 'ic')} 刪除整支收藏</button>`);
    sh.querySelector('#vmCap').onclick = () => location.href = `capture.html?v=${videoId}`;
    sh.querySelector('#vmMeta').onclick = () => location.href = `capture.html?v=${videoId}&mode=meta`;
    sh.querySelector('#vmDel').onclick = () => {
      if (!confirm(`將刪除這支影片的 ${clips.length} 張收藏，YouTube 原片不受影響。確定？`)) return;
      clips.forEach(c => M.removeClip(c.id));
      location.href = 'home.html';
    };
  };

  // 標記縮圖網格：點=跳轉播放、長按=編輯
  const grid = document.getElementById('clipGrid');
  function renderClips() {
    grid.innerHTML = '';
    for (const c of clips) {
      const tile = document.createElement('div');
      tile.className = 'clip-tile' + (c.id === selectedId ? ' playing' : '');
      tile.innerHTML = `<div class="sb-frame" style="${M.thumbStyle(c.videoId, c.start)}" role="img" aria-label="片段縮圖"></div>
        <span class="badge">${M.fmtTime(c.start)}</span>
        <button class="edit-btn" aria-label="編輯 ${M.fmtTime(c.start)} 的圖資">${APP.svg(APP.ICONS.edit, 'ic')}</button>`;
      // 長按之外的替代入口：v1 的「就地編輯」只能長按，鍵盤與輔助技術到不了
      tile.querySelector('.edit-btn').addEventListener('click', e => {
        e.stopPropagation();
        APP.openShotSheet(c, renderClips);
      });
      APP.bindPress(tile, { onTap: () => focus(c), onHold: () => APP.openShotSheet(c, renderClips) });
      grid.appendChild(tile);
    }
    renderMeta();
  }
  renderClips();
</script>
</body>
</html>
