<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>videoshot · 資料夾</title>
<link rel="stylesheet" href="styles.css">
<script src="auth.js"></script>
</head>
<body>
<div class="app-main">
  <div class="topbar">
    <button class="back" id="backBtn" onclick="history.length>1?history.back():location.href='folders.html'"></button>
    <span class="title" id="fTitle">資料夾</span>
    <button class="more" id="moreBtn" aria-label="這個資料夾的選項"></button>
  </div>
  <div class="fd-breadcrumb" id="crumb"></div>
  <div class="fd-list" id="subs"></div>
  <div class="date-group"><div class="tiles" id="tiles"></div></div>
  <div class="empty" id="empty" hidden></div>
</div>

<div id="nav"></div>

<script src="/shared/storyboard.js"></script>
<script src="mock-data.js"></script>
<script src="app.js"></script>
<script>
document.getElementById('nav').innerHTML = APP.renderNav('folders');
document.getElementById('backBtn').innerHTML = APP.svg(APP.ICONS.back, 'ic');
document.getElementById('moreBtn').innerHTML = APP.svg(APP.ICONS.more, 'ic', true);

const id = new URLSearchParams(location.search).get('id');
const folder = M.folderById(id);
if (!folder) location.replace('folders.html');

if (folder) {
document.getElementById('fTitle').textContent = folder.name;

// 麵包屑
const crumbs = [];
let p = folder;
while (p) { crumbs.unshift(p.name); p = M.folderById(p.parent); }
document.getElementById('crumb').textContent = '分類 / ' + crumbs.join(' / ');

function render() {
  // 子資料夾
  const subs = document.getElementById('subs');
  subs.innerHTML = '';
  for (const ch of M.folderChildren(id)) {
    const row = document.createElement('div');
    row.className = 'fd-row';
    row.innerHTML = `${APP.svg(APP.ICONS.folder, 'ic')}<span class="name">${ch.name}</span>
      <span class="cnt">${APP.num(M.folderCount(ch.id))}</span>${APP.svg(APP.ICONS.chevronRight, 'ic')}`;
    row.onclick = () => location.href = `folder.html?id=${ch.id}`;
    subs.appendChild(row);
  }

  // 本層的圖（新加入在前 → mock 以陣列序）
  const ids = M.FOLDER_SHOTS[id] || new Set();
  const shots = M.CLIPS.filter(c => ids.has(c.id));
  const tiles = document.getElementById('tiles');
  tiles.innerHTML = '';
  shots.forEach((c, i) => {
    const tile = document.createElement('button');
    tile.type = 'button';
    tile.className = 'tile';
    tile.innerHTML = `<div class="thumb"><div class="sb-frame" style="${M.thumbStyle(c.videoId, c.start)}" role="img" aria-label="${c.summary || '片段縮圖'}"></div></div>`;
    tile.onclick = () => APP.openLightbox(shots, i, { onChange: render });
    tiles.appendChild(tile);
  });
  const emptyEl = document.getElementById('empty');
  emptyEl.hidden = !!(shots.length || M.folderChildren(id).length);
  if (!emptyEl.hidden) emptyEl.innerHTML = `${APP.svg(APP.ICONS.folder, 'ic')}
    <div>這個資料夾還沒有圖片</div>
    <div style="font-size:var(--t-sm)">在首頁點開任何一張圖 →【加入分類】</div>`;
}
render();

/* 改名／刪除：分類頁的長按讓給排序了，管理動作改在資料夾裡做 */
document.getElementById('moreBtn').onclick = () => {
  const sh = APP.openPanel(`
    <div class="srow"><span class="trange">${folder.name}</span>
      <button class="close" onclick="closeSheet()">${APP.svg(APP.ICONS.close, 'ic')}</button></div>
    <button class="act-row" id="fmRen">${APP.svg(APP.ICONS.edit, 'ic')} 改名</button>
    <button class="act-row danger" id="fmDel">${APP.svg(APP.ICONS.trash, 'ic')} 刪除資料夾</button>`);

  sh.querySelector('#fmRen').onclick = () => {
    const name = prompt('新名稱？', folder.name);
    if (!name) return;
    M.renameFolder(id, name.trim());
    document.getElementById('fTitle').textContent = folder.name;
    crumbs[crumbs.length - 1] = folder.name;
    document.getElementById('crumb').textContent = '分類 / ' + crumbs.join(' / ');
    closeSheet();
    APP.toast('已改名');
  };

  sh.querySelector('#fmDel').onclick = () => {
    const n = M.folderCount(id);
    if (!confirm(`刪除「${folder.name}」？收藏的 ${n} 張圖本身不會被刪。`)) return;
    M.deleteFolder(id);
    closeSheet();
    sessionStorage.setItem('ytspace2_folder_toast', '已刪除資料夾（圖片仍在首頁）');
    location.replace('folders.html');
  };
};
}
</script>
</body>
</html>
