<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>videoshot · 登入</title>
<link rel="stylesheet" href="styles.css">
<script src="auth.js" data-public></script>
<!-- 已經登入的人不該再看到登入頁（例如按上一頁退回來）。放在 head 才不會先閃一下畫面。 -->
<script>if (AUTH.user()) location.replace('home.html');</script>
</head>
<body>
<!-- 首次登入頁：整個系統唯一不需要登入就能看的頁面。
     這裡只有一條路可以走（Google 登入），所以頁面上除了那顆按鈕之外的每一個字都是
     在拖慢它。說明性的文字一概不放：使用者沒有第二個選項要衡量，講再多也不會改變動作。 -->
<div class="app-main no-nav login-page">
  <div class="lg-wrap">

    <div class="lg-brand">
      <div class="lg-mark" id="mark"></div>
      <h1 class="lg-name">videoshot</h1>
      <p class="lg-tag">把 YouTube 的畫面，收成自己的圖庫</p>
    </div>

    <div class="lg-act">
      <button class="btn google block" id="go"></button>
      <p class="lg-fine"><a href="#">服務條款</a> | <a href="#">隱私權政策</a></p>
    </div>

  </div>
</div>

<script src="/shared/storyboard.js"></script>
<script src="mock-data.js"></script>
<script src="app.js"></script>
<script>
  document.getElementById('mark').innerHTML = APP.svg(APP.ICONS.imagePlus, 'ic');

  /* Google 的彩色 G。品牌識別不能改色，所以按鈕底色維持中性、只有這顆是彩的。 */
  const G_LOGO = `<svg class="g-logo" viewBox="0 0 48 48" aria-hidden="true">
    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
  </svg>`;

  const btn = document.getElementById('go');
  const idle = () => { btn.innerHTML = `${G_LOGO}<span>使用 Google 帳號登入</span>`; btn.disabled = false; };
  idle();

  btn.onclick = () => {
    btn.disabled = true;
    btn.innerHTML = `<span class="lg-spin"></span><span>登入中…</span>`;
    /* 原型直接假裝 OAuth 轉跳回來；真的接上時這裡換成 Google 的授權流程 */
    setTimeout(() => {
      AUTH.signIn({ name: 'Scott Lin', mail: 'mmx112945@gmail.com', initial: 'S' });
      sessionStorage.removeItem('ytspace2_after_login');
      location.replace(back && back !== 'login.html' ? back : 'home.html');
    }, 900);
  };
</script>
</body>
</html>
