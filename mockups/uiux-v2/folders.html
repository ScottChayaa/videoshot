<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>videoshot · 分類</title>
<link rel="stylesheet" href="styles.css">
<script src="auth.js"></script>
</head>
<body>
<div class="app-main">
  <div class="topbar">
    <span class="title">分類</span>
    <button class="icon-btn" id="filterBtn" aria-label="篩選分類名稱"></button>
    <button class="more accent" id="add" aria-label="新增資料夾"></button>
  </div>

  <!-- 篩選列：分類多的時候才需要，平常收在頂列的放大鏡後面 -->
  <div class="fd-search" id="searchBar" hidden>
    <div class="search block" id="searchBox">
      <input id="searchInput" placeholder="搜尋分類名稱" autocomplete="off">
    </div>
    <button class="btn quiet" id="searchCancel">取消</button>
  </div>

  <!-- 狀態列：數量 ＋ 目前排序。排序不做成圖示，因為箭頭圖示說不出「現在怎麼排」 -->
  <div class="fd-status">
    <span id="statCount"></span>
    <button class="sortpick" id="sortBtn"></button>
  </div>

  <div class="fd-grid" id="list"></div>
  <div class="empty" id="empty" hidden></div>
</div>

<div id="nav"></div>

<script src="/shared/storyboard.js"></script>
<script src="mock-data.js"></script>
<script src="app.js"></script>
<script>
document.getElementById('nav').innerHTML = APP.renderNav('folders');
document.getElementById('add').innerHTML = APP.svg(APP.ICONS.folderPlus, 'ic');
document.getElementById('filterBtn').innerHTML = APP.svg(APP.ICONS.search, 'ic');
document.getElementById('searchBox').insertAdjacentHTML('afterbegin', APP.svg(APP.ICONS.search, 'ic'));

const list = document.getElementById('list');

/* 資料夾（含子孫層）裡的圖，拿來當卡片上的幻燈片 */
function shotsIn(id) {
  const ids = new Set(M.FOLDER_SHOTS[id] || []);
  for (const ch of M.folderChildren(id)) for (const s of shotsIn(ch.id)) ids.add(s.id);
  return M.CLIPS.filter(c => ids.has(c.id));
}
const pickShots = (arr, n) => [...arr].sort(() => Math.random() - 0.5).slice(0, n);

const REDUCE_MOTION = matchMedia('(prefers-reduced-motion: reduce)').matches;
let timers = [];
let query = '';        // 篩選字串

/* ── 排序：預設名稱（zh-Hant 定序＝筆畫順序），numeric 讓「第 2 集」排在「第 10 集」前面 ── */
const byName = (a, b) => a.name.localeCompare(b.name, 'zh-Hant', { numeric: true });
const SORTS = {
  'name-asc':   { label: '名稱 A → Z', cmp: byName },
  'name-desc':  { label: '名稱 Z → A', cmp: (a, b) => byName(b, a) },
  'count-desc': { label: '張數多 → 少', cmp: (a, b) => M.folderCount(b.id) - M.folderCount(a.id) || byName(a, b) },
  'recent':     { label: '最近加入',    cmp: (a, b) => M.FOLDERS.indexOf(b) - M.FOLDERS.indexOf(a) }
};
const SORT_KEY = 'ytspace2_folder_sort';
let sortBy = SORTS[localStorage.getItem(SORT_KEY)] ? localStorage.getItem(SORT_KEY) : 'name-asc';

function orderedFolders() {
  return [...M.folderChildren(null)].sort(SORTS[sortBy].cmp);
}

function render() {
  timers.forEach(clearInterval);
  timers = [];
  list.innerHTML = '';

  const all = orderedFolders();
  const q = query.toLowerCase();
  const folders = q ? all.filter(f => f.name.toLowerCase().includes(q)) : all;

  folders.forEach((f, i) => {
    const shots = pickShots(shotsIn(f.id), 4);
    const frame = c => `<div class="sb-frame" style="${M.thumbStyle(c.videoId, c.start)}" role="img" aria-label="片段縮圖"></div>`;

    const card = document.createElement('div');
    card.className = 'fd-card';
    card.dataset.id = f.id;
    card.innerHTML = `
      <div class="fd-shot">
        ${shots.length
          ? `<div class="fl on">${frame(shots[0])}</div><div class="fl">${shots[1] ? frame(shots[1]) : ''}</div>`
          : `<div class="ph">${APP.svg(APP.ICONS.folder, 'ic')}</div>`}
        <span class="fd-n">${APP.num(M.folderCount(f.id))} 張</span>
      </div>
      <div class="fd-line"><span class="name">${f.name}</span></div>`;

    // 幻燈片：兩層交替淡入，每張卡的間隔錯開，整頁才不會一起換圖
    if (shots.length > 1 && !REDUCE_MOTION) {
      const layers = card.querySelectorAll('.fd-shot .fl');
      let idx = 0, front = 0;
      timers.push(setInterval(() => {
        if (document.hidden) return;
        idx = (idx + 1) % shots.length;
        const back = 1 - front;
        layers[back].innerHTML = frame(shots[idx]);
        layers[back].classList.add('on');
        layers[front].classList.remove('on');
        front = back;
      }, 4000 + i * 900));
    }

    card.addEventListener('click', () => location.href = `folder.html?id=${f.id}`);
    list.appendChild(card);
  });

  // 狀態列：篩選中改成「符合 N 個」，順便當作篩選有沒有生效的回饋
  document.getElementById('statCount').textContent =
    query ? `符合 ${APP.num(folders.length)} 個` : `${APP.num(folders.length)} 個分類`;
  document.getElementById('sortBtn').innerHTML =
    `<span>${SORTS[sortBy].label}</span>${APP.svg(APP.ICONS.chevronDown, 'ic')}`;

  const emptyEl = document.getElementById('empty');
  emptyEl.hidden = folders.length > 0;
  if (folders.length) return;

  emptyEl.innerHTML = query
    ? `${APP.svg(APP.ICONS.search, 'ic')}
       <div>沒有符合「${query}」的分類</div>
       <button class="btn secondary" id="emptyClear">清除篩選</button>`
    : `${APP.svg(APP.ICONS.folder, 'ic')}
       <div>還沒有任何分類</div>
       <button class="btn secondary" id="emptyAdd">${APP.svg(APP.ICONS.folderPlus, 'ic')} 新增資料夾</button>`;
  const clr = document.getElementById('emptyClear');
  if (clr) clr.onclick = closeSearch;
  const addBtn = document.getElementById('emptyAdd');
  if (addBtn) addBtn.onclick = addFolder;
}

/* ── 篩選 ── */
const searchBar = document.getElementById('searchBar');
const searchInput = document.getElementById('searchInput');
function openSearch() { searchBar.hidden = false; searchInput.focus(); }
function closeSearch() {
  query = ''; searchInput.value = ''; searchBar.hidden = true; render();
}
document.getElementById('filterBtn').onclick = () => searchBar.hidden ? openSearch() : closeSearch();
document.getElementById('searchCancel').onclick = closeSearch;
searchInput.addEventListener('input', () => { query = searchInput.value.trim(); render(); });

/* ── 排序抽屜：選項寫清楚中文是照筆畫排，目前的選項打勾 ── */
document.getElementById('sortBtn').onclick = () => {
  const rows = Object.entries(SORTS).map(([k, s]) => `
    <button class="act-row" data-k="${k}">
      <span>${s.label}</span>
      ${k === sortBy ? APP.svg(APP.ICONS.check, 'ic chk') : ''}
    </button>`).join('');
  const sh = APP.openPanel(`
    <div class="srow"><span class="trange">排序方式</span>
      <button class="close" onclick="closeSheet()">${APP.svg(APP.ICONS.close, 'ic')}</button></div>
    ${rows}`);
  sh.querySelectorAll('[data-k]').forEach(row => row.onclick = () => {
    sortBy = row.dataset.k;
    localStorage.setItem(SORT_KEY, sortBy);
    closeSheet();
    render();
  });
};

function addFolder() {
  const name = prompt('資料夾名稱？');
  if (name) { M.addFolder(name.trim(), null); render(); }
}
document.getElementById('add').onclick = addFolder;

render();

// 從資料夾內頁刪除後導回來的提示
const pendingToast = sessionStorage.getItem('ytspace2_folder_toast');
if (pendingToast) { sessionStorage.removeItem('ytspace2_folder_toast'); APP.toast(pendingToast); }
</script>
</body>
</html>
